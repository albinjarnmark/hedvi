<text x="314" y="173" fill="#F7F4EA" font-family="Arial,sans-serif" font-size="20" font-weight="700">Sent</text>
<text x="314" y="207" fill="#C9D5CF" font-family="Arial,sans-serif" font-size="15">Provider accepted</text>
<path d="M538 166h12m-5-5 5 5-5 5" stroke="#D5F86B" stroke-width="2" fill="none"/>
<rect x="556" y="90" width="236" height="162" rx="12" fill="#193B35" stroke="#426159"/>
<circle cx="586" cy="123" r="17" fill="#D5F86B"/>
<text x="586" y="129" text-anchor="middle" fill="#102C28" font-family="Arial,sans-serif" font-size="18" font-weight="700">3</text>
<text x="574" y="173" fill="#F7F4EA" font-family="Arial,sans-serif" font-size="20" font-weight="700">Delivered</text>
<text x="574" y="207" fill="#C9D5CF" font-family="Arial,sans-serif" font-size="15">Recipient server accepted</text>
<path d="M798 166h12m-5-5 5 5-5 5" stroke="#D5F86B" stroke-width="2" fill="none"/>
