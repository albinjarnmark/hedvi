<circle cx="846" cy="123" r="17" fill="#D5F86B"/>
<text x="846" y="129" text-anchor="middle" fill="#102C28" font-family="Arial,sans-serif" font-size="18" font-weight="700">4</text>
<text x="834" y="173" fill="#F7F4EA" font-family="Arial,sans-serif" font-size="20" font-weight="700">Check recipient</text>
<text x="834" y="207" fill="#C9D5CF" font-family="Arial,sans-serif" font-size="15">Inbox placement can vary</text>
<text x="36" y="298" fill="#C9D5CF" font-family="Arial,sans-serif" font-size="17">Bounce or complaint → organization suppression. Unknown outcome → investigation, no blind resend.</text>
