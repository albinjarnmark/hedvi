<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
<title id="title">Follow each recipient</title>
<desc id="desc">Bounce or complaint → organization suppression. Unknown outcome → investigation, no blind resend.</desc>
<rect width="1080" height="370" rx="20" fill="#102C28"/>
<text x="36" y="53" fill="#F7F4EA" font-family="Arial,sans-serif" font-size="27" font-weight="700">Follow each recipient</text>
<rect x="36" y="90" width="236" height="162" rx="12" fill="#193B35" stroke="#426159"/>
<circle cx="66" cy="123" r="17" fill="#D5F86B"/>
<text x="66" y="129" text-anchor="middle" fill="#102C28" font-family="Arial,sans-serif" font-size="18" font-weight="700">1</text>
<text x="54" y="173" fill="#F7F4EA" font-family="Arial,sans-serif" font-size="20" font-weight="700">Queued</text>
<text x="54" y="207" fill="#C9D5CF" font-family="Arial,sans-serif" font-size="15">Saved with quota reserved</text>
<path d="M278 166h12m-5-5 5 5-5 5" stroke="#D5F86B" stroke-width="2" fill="none"/>
