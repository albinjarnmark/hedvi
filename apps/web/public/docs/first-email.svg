<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="370" viewBox="0 0 1080 370" role="img" aria-labelledby="title desc">
<title id="title">Your first test email</title>
<desc id="desc">Test mode captures messages. It never sends them to external recipients.</desc>
